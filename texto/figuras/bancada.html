<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Figura 1</title>
<!-- Gerado por texto/figuras/juntar_bancada.py a partir de arquitetura.html e
     modos.html; nao edite a mao. PDF e PNG: texto/figuras/exportar.ps1. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=block">
<style>
:root {
  --ink: #17202A; --ink-2: #3A4550; --muted: #5E6872; --white: #FFFFFF;
  --data: #5E6872; --prod: #2B5797; --brk: #A5620F; --cons: #2D7552; --infra: #3A4550;
  --cli: #2D7552; --wrk: #2B5797; --fila: #7A848D;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@page { size: 720px 508px; margin: 0; }
html, body { margin: 0; padding: 0; background: var(--white); }
svg { display: block; width: 720px; height: 508px; }
.host { fill: #FAFAF9; stroke: var(--ink-2); stroke-width: 1.1; stroke-dasharray: 5 3; }
.host-t { font: 600 10px var(--mono); letter-spacing: .06em; fill: var(--ink-2); }
.grp { fill: var(--white); stroke-width: 1.3; }
.grp-t { font: 700 12.5px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.core { font: 400 9.5px var(--mono); fill: var(--muted); text-anchor: middle; }
.lbl { font: 600 11.5px var(--sans); fill: var(--ink); text-anchor: middle; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.ah { fill: var(--muted); }
.g { fill: none; stroke: var(--white); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gf { fill: var(--white); stroke: none; }
.row { font: 700 16px var(--display); letter-spacing: .03em; text-transform: uppercase; fill: var(--ink); dominant-baseline: central; }
.sep { stroke: #E2E5E8; stroke-width: 1; }
.gt { font: 600 10px var(--mono); fill: var(--white); text-anchor: middle; dominant-baseline: central; }
.leg { font: 10px var(--mono); fill: var(--ink-2); dominant-baseline: central; }
.zoom { fill: none; stroke: var(--cons); stroke-width: 1; stroke-dasharray: 4 3; }
.det { fill: #F7FAF8; stroke: var(--cons); stroke-width: 1.1; stroke-dasharray: 5 3; }
.det-t { font: 600 10px var(--mono); letter-spacing: .06em; fill: var(--cons); }
</style></head><body>
<svg viewBox="0 0 720 508" role="img" aria-label="Figura 1: arquitetura da bancada em cinco etapas, da OpenF1 ao PostgreSQL, e, embaixo, o detalhe da etapa de processamento com os três modos de entrega numa faixa: Direct, Channels e Pipelines.">
<!-- Arquitetura -->

<defs><marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>

<!-- 1 Dados: fora do Docker, uma vez -->
<rect class="grp" style="stroke:var(--data)" x="6" y="40" width="112" height="160" rx="6"/>
<text class="grp-t" style="fill:var(--data)" x="14" y="57">1 · Dados</text>
<g transform="translate(16 92)"><rect width="40" height="40" rx="6" style="fill:var(--data)"/>
  <path class="g" d="M12 27 H28 A5.5 5.5 0 0 0 28 16 A7.5 7.5 0 0 0 14 14.5 A6 6 0 0 0 12 27 Z"/></g>
<text class="lbl" x="36" y="150">OpenF1</text>
<g transform="translate(68 92)"><rect width="40" height="40" rx="6" style="fill:var(--data)"/>
  <path class="g" d="M13 9 H23 L28 14 V31 H13 Z M23 9 V14 H28 M16.5 20 H24.5 M16.5 25 H24.5"/></g>
<text class="lbl" x="88" y="150">Cópia</text>
<text class="lbl" x="88" y="164">local</text>
<path class="ln" d="M56 112 H66" marker-end="url(#ah)"/>

<!-- Docker -->
<rect class="host" x="126" y="18" width="588" height="190" rx="8"/>
<text class="host-t" x="136" y="31">DOCKER · NÚCLEOS EXCLUSIVOS</text>

<!-- 2 Ingestão -->
<rect class="grp" style="stroke:var(--prod)" x="134" y="40" width="74" height="160" rx="6"/>
<text class="grp-t" style="fill:var(--prod)" x="141" y="57">2 · Ingestão</text>
<g transform="translate(151 92)"><rect width="40" height="40" rx="6" style="fill:var(--prod)"/>
  <path class="gf" d="M10 12 L20 20 L10 28 Z M20 12 L30 20 L20 28 Z"/></g>
<text class="lbl" x="171" y="150">Gerador</text>
<text class="core" x="171" y="192">núcleos 0–3</text>

<!-- 3 Mensageria -->
<rect class="grp" style="stroke:var(--brk)" x="216" y="40" width="94" height="160" rx="6"/>
<text class="grp-t" style="fill:var(--brk)" x="223" y="57">3 · Mensageria</text>
<g transform="translate(243 92)"><rect width="40" height="40" rx="6" style="fill:var(--brk)"/>
  <path class="g" d="M10 11.5 H30 M10 17 H30 M10 22.5 H30 M10 28 H30"/></g>
<text class="lbl" x="263" y="150">Kafka ou</text>
<text class="lbl" x="263" y="164">RabbitMQ</text>
<text class="core" x="263" y="192">núcleos 4–7</text>

<!-- 4 Processamento -->
<rect class="grp" style="stroke:var(--cons)" x="318" y="40" width="278" height="160" rx="6"/>
<text class="grp-t" style="fill:var(--cons)" x="325" y="57">4 · Processamento</text>
<!-- consumidor empilhado: uma instância por faixa -->
<rect x="349" y="83" width="40" height="40" rx="6" style="fill:var(--cons);opacity:.35"/>
<rect x="345" y="87" width="40" height="40" rx="6" style="fill:var(--cons);opacity:.6"/>
<g transform="translate(341 92)"><rect width="40" height="40" rx="6" style="fill:var(--cons);stroke:var(--white);stroke-width:1"/>
  <rect class="g" x="13" y="13" width="14" height="14" rx="1.5"/>
  <path class="g" d="M17 9 V13 M23 9 V13 M17 27 V31 M23 27 V31 M9 17 H13 M9 23 H13 M27 17 H31 M27 23 H31"/></g>
<text class="lbl" x="363" y="150">Consumidor</text>
<g transform="translate(440 92)"><rect width="40" height="40" rx="6" style="fill:var(--cons)"/>
  <path class="g" d="M9 20 H17 M17 20 L29 11 M17 20 H29 M17 20 L29 29"/>
  <path class="gf" d="M29 8.5 L32.5 10.6 L29.2 13.4 Z M29 17.8 L32.8 20 L29 22.2 Z M29.2 26.6 L32.5 29.4 L29 31.5 Z"/></g>
<text class="lbl" x="460" y="150">Direct, Channels</text>
<text class="lbl" x="460" y="164">ou Pipelines</text>
<g transform="translate(537 92)"><rect width="40" height="40" rx="6" style="fill:var(--cons)"/>
  <rect class="g" x="8.5" y="13" width="23" height="14" rx="1.5"/>
  <path class="g" d="M16.2 13 V27 M23.8 13 V27"/></g>
<text class="lbl" x="557" y="150">Janelas e</text>
<text class="lbl" x="557" y="164">detecção</text>
<text class="core" x="457" y="192">núcleos 8–10</text>

<!-- 5 Persistência e métricas -->
<rect class="grp" style="stroke:var(--infra)" x="604" y="40" width="102" height="160" rx="6"/>
<text class="grp-t" style="fill:var(--infra)" x="611" y="57">5 · Persistência</text>
<g transform="translate(635 68)"><rect width="40" height="40" rx="6" style="fill:var(--infra)"/>
  <ellipse class="g" cx="20" cy="12.5" rx="8.5" ry="3.2"/>
  <path class="g" d="M11.5 12.5 V27.5 A8.5 3.2 0 0 0 28.5 27.5 V12.5 M11.5 20 A8.5 3.2 0 0 0 28.5 20"/></g>
<text class="lbl" x="655" y="122">PostgreSQL</text>
<g transform="translate(635 130)"><rect width="40" height="40" rx="6" style="fill:var(--infra)"/>
  <path class="g" d="M10 10 V30 H31 M13 26 L19 18 L24 22 L30 12"/></g>
<text class="lbl" x="655" y="184">Métricas</text>
<text class="core" x="655" y="196">núcleo 11</text>

<!-- Fluxo -->
<path class="ln" d="M108 112 H149" marker-end="url(#ah)"/>
<path class="ln" d="M191 112 H241" marker-end="url(#ah)"/>
<path class="ln" d="M283 101 H339" marker-end="url(#ah)"/>
<path class="ln" d="M283 108.3 H339" marker-end="url(#ah)"/>
<path class="ln" d="M283 115.7 H339" marker-end="url(#ah)"/>
<path class="ln" d="M283 123 H339" marker-end="url(#ah)"/>
<path class="ln" d="M385 112 H438" marker-end="url(#ah)"/>
<path class="ln" d="M480 112 H535" marker-end="url(#ah)"/>
<path class="ln" d="M577 112 H599 V88 H633" marker-end="url(#ah)"/>

<!-- Zoom da etapa 4 para o detalhe -->
<path class="zoom" d="M318 200 L10 224"/>
<path class="zoom" d="M596 200 L710 224"/>
<rect class="det" x="4" y="224" width="712" height="280" rx="8"/>
<text class="det-t" x="14" y="238">ETAPA 4 EM DETALHE · UMA FAIXA</text>
<g transform="translate(8 246) scale(0.97)">

<defs>
  <marker id="m-ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker>
  <!-- Glifos 40x40, os mesmos da Figura 2 -->
  <g id="m-broker"><rect width="40" height="40" rx="6" style="fill:var(--brk)"/><path class="g" d="M10 11.5 H30 M10 17 H30 M10 22.5 H30 M10 28 H30"/></g>
  <g id="m-callback"><rect width="40" height="40" rx="6" style="fill:var(--cli)"/><path class="g" d="M10 22 V29 H30 V22 M20 9 V21 M15 16 L20 21 L25 16"/></g>
  <g id="m-channel"><rect width="40" height="40" rx="6" style="fill:var(--fila)"/><rect class="g" x="8" y="14" width="24" height="12" rx="2"/><path class="gf" d="M11 17 h4 v6 h-4 z M18 17 h4 v6 h-4 z M25 17 h4 v6 h-4 z"/></g>
  <g id="m-pipe"><rect width="40" height="40" rx="6" style="fill:var(--fila)"/><rect class="g" x="8" y="13" width="24" height="14" rx="7"/><text class="gt" x="20" y="20.5">01</text></g>
  <g id="m-leitor"><rect width="40" height="40" rx="6" style="fill:var(--wrk)"/><path class="g" d="M10 18 V29 H30 V18 M20 22 V9 M15 14 L20 9 L25 14"/></g>
  <g id="m-janelas"><rect class="g" x="8.5" y="13" width="23" height="14" rx="1.5"/><path class="g" d="M16.2 13 V27 M23.8 13 V27"/></g>
</defs>

<!-- Direct -->
<text class="row" x="8" y="30">Direct</text>
<use href="#m-broker" x="130" y="10"/><text class="lbl" x="150" y="64">Broker</text>
<path class="ln" d="M170 30 H248" marker-end="url(#m-ah)"/>
<use href="#m-callback" x="250" y="10"/><text class="lbl" x="270" y="64">Callback</text>
<path class="ln" d="M290 30 H608" marker-end="url(#m-ah)"/>
<g transform="translate(610 10)"><rect width="40" height="40" rx="6" style="fill:var(--cli)"/><use href="#m-janelas"/></g>
<text class="lbl" x="630" y="64">Processa</text>
<line class="sep" x1="8" y1="80" x2="712" y2="80"/>

<!-- Channels -->
<text class="row" x="8" y="110">Channels</text>
<use href="#m-broker" x="130" y="90"/><text class="lbl" x="150" y="144">Broker</text>
<path class="ln" d="M170 110 H248" marker-end="url(#m-ah)"/>
<use href="#m-callback" x="250" y="90"/><text class="lbl" x="270" y="144">Callback</text>
<path class="ln" d="M290 110 H368" marker-end="url(#m-ah)"/>
<use href="#m-channel" x="370" y="90"/><text class="lbl" x="390" y="144">Channel</text>
<path class="ln" d="M410 110 H488" marker-end="url(#m-ah)"/>
<use href="#m-leitor" x="490" y="90"/><text class="lbl" x="510" y="144">Leitor</text>
<path class="ln" d="M530 110 H608" marker-end="url(#m-ah)"/>
<g transform="translate(610 90)"><rect width="40" height="40" rx="6" style="fill:var(--wrk)"/><use href="#m-janelas"/></g>
<text class="lbl" x="630" y="144">Processa</text>
<line class="sep" x1="8" y1="160" x2="712" y2="160"/>

<!-- Pipelines -->
<text class="row" x="8" y="190">Pipelines</text>
<use href="#m-broker" x="130" y="170"/><text class="lbl" x="150" y="224">Broker</text>
<path class="ln" d="M170 190 H248" marker-end="url(#m-ah)"/>
<use href="#m-callback" x="250" y="170"/><text class="lbl" x="270" y="224">Callback</text>
<path class="ln" d="M290 190 H368" marker-end="url(#m-ah)"/>
<use href="#m-pipe" x="370" y="170"/><text class="lbl" x="390" y="224">Pipe</text>
<path class="ln" d="M410 190 H488" marker-end="url(#m-ah)"/>
<use href="#m-leitor" x="490" y="170"/><text class="lbl" x="510" y="224">Leitor</text>
<path class="ln" d="M530 190 H608" marker-end="url(#m-ah)"/>
<g transform="translate(610 170)"><rect width="40" height="40" rx="6" style="fill:var(--wrk)"/><use href="#m-janelas"/></g>
<text class="lbl" x="630" y="224">Processa</text>

<!-- Legenda das cores -->
<rect x="8" y="244" width="12" height="12" rx="2" style="fill:var(--cli)"/><text class="leg" x="25" y="250">thread do cliente</text>
<rect x="146" y="244" width="12" height="12" rx="2" style="fill:var(--wrk)"/><text class="leg" x="163" y="250">thread de trabalho</text>
<rect x="290" y="244" width="12" height="12" rx="2" style="fill:var(--fila)"/><text class="leg" x="307" y="250">fila interna</text>

</g>
</svg>
</body></html>
