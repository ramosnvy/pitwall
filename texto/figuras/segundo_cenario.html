<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Figura 4</title>
<!-- Figura 4 do TCC2: como cada modo trata a espera pela confirmacao da saida
     republicada, no segundo cenario. So o essencial; a explicacao esta no texto
     (Metodologia, Segundo Cenario). Mesmo estilo das Figuras 1 a 3.
     PDF e PNG: texto/figuras/exportar.ps1. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=block">
<style>
:root {
  --ink: #17202A; --ink-2: #3A4550; --muted: #5E6872; --white: #FFFFFF;
  --prod: #2B5797; --prod-bg: #E0E8F5;
  --brk: #A5620F; --brk-bg: #F5E9D6; --cons: #2D7552; --cons-bg: #E1EEE5;
  --stop: #A93A2E; --stop-bg: #F6E0DC;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@page { size: 720px 120px; margin: 0; }
html, body { margin: 0; padding: 0; background: var(--white); }
svg { display: block; width: 720px; height: 120px; }
.row { font: 700 16px var(--display); letter-spacing: .03em; text-transform: uppercase; fill: var(--ink); dominant-baseline: central; }
.bx { stroke-width: 1.2; }
.t { font: 600 13px var(--sans); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.ln2 { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ah { fill: var(--muted); }
.brk { fill: var(--brk-bg); stroke: var(--brk); }
.cli { fill: var(--cons-bg); stroke: var(--cons); }
.wrk { fill: var(--prod-bg); stroke: var(--prod); }
.stop { fill: var(--stop-bg); stroke: var(--stop); }
.leg { font: 10px var(--mono); fill: var(--ink-2); dominant-baseline: central; }
</style></head><body>
<svg viewBox="0 0 720 120" role="img" aria-label="Figura 4: no segundo cenário, o modo direto recebe, processa, publica e para para esperar as confirmações antes de confirmar a entrada; Channels e Pipelines publicam num estágio próprio e confirmam a entrada sem parar a recepção.">
<defs><marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>

<!-- Direct -->
<text class="row" x="8" y="24">Direct</text>
<rect class="bx brk" x="92" y="8" width="72" height="32" rx="4"/><text class="t" x="128" y="24">Broker</text>
<path class="ln" d="M164 24 H178" marker-end="url(#ah)"/>
<rect class="bx cli" x="180" y="8" width="344" height="32" rx="4"/><text class="t" x="352" y="24">Recebe, processa e publica</text>
<path class="ln" d="M524 24 H538" marker-end="url(#ah)"/>
<rect class="bx stop" x="540" y="8" width="84" height="32" rx="4"/><text class="t" x="582" y="24">Espera</text>
<path class="ln" d="M624 24 H638" marker-end="url(#ah)"/>
<rect class="bx cli" x="640" y="8" width="72" height="32" rx="4"/><text class="t" x="676" y="24">Confirma</text>

<!-- Channels e Pipelines -->
<text class="row" x="8" y="62">Channels</text>
<text class="row" x="8" y="78">Pipelines</text>
<rect class="bx brk" x="92" y="54" width="72" height="32" rx="4"/><text class="t" x="128" y="70">Broker</text>
<path class="ln" d="M164 70 H178" marker-end="url(#ah)"/>
<rect class="bx cli" x="180" y="54" width="104" height="32" rx="4"/><text class="t" x="232" y="70">Recebe</text>
<path class="ln" d="M284 70 H298" marker-end="url(#ah)"/>
<rect class="bx wrk" x="300" y="54" width="104" height="32" rx="4"/><text class="t" x="352" y="70">Processa</text>
<path class="ln" d="M404 70 H418" marker-end="url(#ah)"/>
<rect class="bx wrk" x="420" y="54" width="104" height="32" rx="4"/><text class="t" x="472" y="70">Publica</text>
<path class="ln2" d="M524 70 H638" marker-end="url(#ah)"/>
<rect class="bx cli" x="640" y="54" width="72" height="32" rx="4"/><text class="t" x="676" y="70">Confirma</text>

<!-- Legenda das cores -->
<rect class="bx cli" x="8" y="102" width="12" height="12" rx="2"/><text class="leg" x="25" y="108">thread do cliente</text>
<rect class="bx wrk" x="146" y="102" width="12" height="12" rx="2"/><text class="leg" x="163" y="108">threads de trabalho</text>
<rect class="bx stop" x="296" y="102" width="12" height="12" rx="2"/><text class="leg" x="313" y="108">recepção parada</text>
<path class="ln2" d="M440 108 H470"/><text class="leg" x="476" y="108">confirmações em paralelo</text>
</svg>
</body></html>
