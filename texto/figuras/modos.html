<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Figura 3</title>
<!-- Figura 3 do TCC2: o caminho de um evento dentro do consumidor, numa faixa,
     em cada modo. A cor diz em que thread cada passo roda. So o essencial; o
     que cada passo faz esta no texto (Etapa 4). Mesmo estilo das Figuras 1 e 2.
     PDF e PNG: texto/figuras/exportar.ps1. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=block">
<style>
:root {
  --ink: #17202A; --ink-2: #3A4550; --muted: #5E6872; --white: #FFFFFF;
  --prod: #2B5797; --prod-bg: #E0E8F5;
  --brk: #A5620F; --brk-bg: #F5E9D6; --cons: #2D7552; --cons-bg: #E1EEE5;
  --infra: #3A4550; --infra-bg: #EEF0EC;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@page { size: 720px 160px; margin: 0; }
html, body { margin: 0; padding: 0; background: var(--white); }
svg { display: block; width: 720px; height: 160px; }
.row { font: 700 16px var(--display); letter-spacing: .03em; text-transform: uppercase; fill: var(--ink); dominant-baseline: central; }
.bx { stroke-width: 1.2; }
.t { font: 600 13px var(--sans); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.ah { fill: var(--muted); }
.brk { fill: var(--brk-bg); stroke: var(--brk); }
.cli { fill: var(--cons-bg); stroke: var(--cons); }
.wrk { fill: var(--prod-bg); stroke: var(--prod); }
.fila { fill: var(--infra-bg); stroke: var(--infra); }
.leg { font: 10px var(--mono); fill: var(--ink-2); dominant-baseline: central; }
</style></head><body>
<svg viewBox="0 0 720 160" role="img" aria-label="Figura 3: o caminho de um evento dentro do consumidor nos modos Direct, Channels e Pipelines, com a thread em que cada passo roda.">
<defs><marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>

<!-- Direct -->
<text class="row" x="8" y="24">Direct</text>
<rect class="bx brk" x="92" y="8" width="72" height="32" rx="4"/><text class="t" x="128" y="24">Broker</text>
<path class="ln" d="M164 24 H178" marker-end="url(#ah)"/>
<rect class="bx cli" x="180" y="8" width="132" height="32" rx="4"/><text class="t" x="246" y="24">Callback</text>
<path class="ln" d="M312 24 H594" marker-end="url(#ah)"/>
<rect class="bx cli" x="596" y="8" width="116" height="32" rx="4"/><text class="t" x="654" y="24">Processa</text>

<!-- Channels -->
<text class="row" x="8" y="70">Channels</text>
<rect class="bx brk" x="92" y="54" width="72" height="32" rx="4"/><text class="t" x="128" y="70">Broker</text>
<path class="ln" d="M164 70 H178" marker-end="url(#ah)"/>
<rect class="bx cli" x="180" y="54" width="132" height="32" rx="4"/><text class="t" x="246" y="70">Callback</text>
<path class="ln" d="M312 70 H326" marker-end="url(#ah)"/>
<rect class="bx fila" x="328" y="54" width="118" height="32" rx="4"/><text class="t" x="387" y="70">Channel</text>
<path class="ln" d="M446 70 H460" marker-end="url(#ah)"/>
<rect class="bx wrk" x="462" y="54" width="118" height="32" rx="4"/><text class="t" x="521" y="70">Leitor</text>
<path class="ln" d="M580 70 H594" marker-end="url(#ah)"/>
<rect class="bx wrk" x="596" y="54" width="116" height="32" rx="4"/><text class="t" x="654" y="70">Processa</text>

<!-- Pipelines -->
<text class="row" x="8" y="116">Pipelines</text>
<rect class="bx brk" x="92" y="100" width="72" height="32" rx="4"/><text class="t" x="128" y="116">Broker</text>
<path class="ln" d="M164 116 H178" marker-end="url(#ah)"/>
<rect class="bx cli" x="180" y="100" width="132" height="32" rx="4"/><text class="t" x="246" y="116">Callback</text>
<path class="ln" d="M312 116 H326" marker-end="url(#ah)"/>
<rect class="bx fila" x="328" y="100" width="118" height="32" rx="4"/><text class="t" x="387" y="116">Pipe</text>
<path class="ln" d="M446 116 H460" marker-end="url(#ah)"/>
<rect class="bx wrk" x="462" y="100" width="118" height="32" rx="4"/><text class="t" x="521" y="116">Leitor</text>
<path class="ln" d="M580 116 H594" marker-end="url(#ah)"/>
<rect class="bx wrk" x="596" y="100" width="116" height="32" rx="4"/><text class="t" x="654" y="116">Processa</text>

<!-- Legenda das cores -->
<rect class="bx cli" x="8" y="142" width="12" height="12" rx="2"/><text class="leg" x="25" y="148">thread do cliente</text>
<rect class="bx wrk" x="146" y="142" width="12" height="12" rx="2"/><text class="leg" x="163" y="148">thread de trabalho</text>
<rect class="bx fila" x="290" y="142" width="12" height="12" rx="2"/><text class="leg" x="307" y="148">fila interna</text>
</svg>
</body></html>
