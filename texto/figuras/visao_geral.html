<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Figura 1</title>
<!-- Figura 1 do TCC2: visao abstrata da bancada, um icone por etapa, no estilo
     dos diagramas de arquitetura de nuvem, com os mesmos icones e cores da
     Figura 2. So o essencial; a explicacao esta no texto da secao 4.
     PDF e PNG: texto/figuras/exportar.ps1. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=block">
<style>
:root {
  --ink: #17202A; --muted: #5E6872; --white: #FFFFFF;
  --data: #5E6872; --prod: #2B5797; --brk: #A5620F; --cons: #2D7552; --infra: #3A4550;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
}
@page { size: 720px 132px; margin: 0; }
html, body { margin: 0; padding: 0; background: var(--white); }
svg { display: block; width: 720px; height: 132px; }
.st { font: 700 12.5px var(--display); letter-spacing: .04em; text-transform: uppercase; text-anchor: middle; }
.lbl { font: 600 12px var(--sans); fill: var(--ink); text-anchor: middle; }
.note { font: italic 10px var(--sans); fill: var(--muted); text-anchor: middle; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ln2 { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ah { fill: var(--muted); }
.g { fill: none; stroke: var(--white); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.gf { fill: var(--white); stroke: none; }
</style></head><body>
<svg viewBox="0 0 720 132" role="img" aria-label="Figura 1: visão geral da bancada em cinco etapas: OpenF1, gerador, broker, consumidor .NET e resultados; tracejado, a republicação do segundo cenário.">
<defs><marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>

<!-- Ícones 48x48 (os glifos da Figura 2, em escala 1,2) -->
<text class="st" style="fill:var(--data)" x="72" y="14">1 · Dados</text>
<g transform="translate(48 22) scale(1.2)"><rect width="40" height="40" rx="6" style="fill:var(--data)"/>
  <path class="g" d="M12 27 H28 A5.5 5.5 0 0 0 28 16 A7.5 7.5 0 0 0 14 14.5 A6 6 0 0 0 12 27 Z"/></g>
<text class="lbl" x="72" y="88">OpenF1</text>

<text class="st" style="fill:var(--prod)" x="216" y="14">2 · Ingestão</text>
<g transform="translate(192 22) scale(1.2)"><rect width="40" height="40" rx="6" style="fill:var(--prod)"/>
  <path class="gf" d="M10 12 L20 20 L10 28 Z M20 12 L30 20 L20 28 Z"/></g>
<text class="lbl" x="216" y="88">Gerador</text>

<text class="st" style="fill:var(--brk)" x="360" y="14">3 · Mensageria</text>
<g transform="translate(336 22) scale(1.2)"><rect width="40" height="40" rx="6" style="fill:var(--brk)"/>
  <path class="g" d="M10 11.5 H30 M10 17 H30 M10 22.5 H30 M10 28 H30"/></g>
<text class="lbl" x="360" y="88">Broker</text>

<text class="st" style="fill:var(--cons)" x="504" y="14">4 · Processamento</text>
<g transform="translate(480 22) scale(1.2)"><rect width="40" height="40" rx="6" style="fill:var(--cons)"/>
  <rect class="g" x="13" y="13" width="14" height="14" rx="1.5"/>
  <path class="g" d="M17 9 V13 M23 9 V13 M17 27 V31 M23 27 V31 M9 17 H13 M9 23 H13 M27 17 H31 M27 23 H31"/></g>
<text class="lbl" x="504" y="88">Consumidor .NET</text>

<text class="st" style="fill:var(--infra)" x="648" y="14">5 · Persistência</text>
<g transform="translate(624 22) scale(1.2)"><rect width="40" height="40" rx="6" style="fill:var(--infra)"/>
  <ellipse class="g" cx="20" cy="12.5" rx="8.5" ry="3.2"/>
  <path class="g" d="M11.5 12.5 V27.5 A8.5 3.2 0 0 0 28.5 27.5 V12.5 M11.5 20 A8.5 3.2 0 0 0 28.5 20"/></g>
<text class="lbl" x="648" y="88">Resultados</text>

<!-- Fluxo -->
<path class="ln" d="M96 46 H190" marker-end="url(#ah)"/>
<path class="ln" d="M240 46 H334" marker-end="url(#ah)"/>
<path class="ln" d="M384 46 H478" marker-end="url(#ah)"/>
<path class="ln" d="M528 46 H622" marker-end="url(#ah)"/>

<!-- Segundo cenário -->
<path class="ln2" d="M504 96 V108 H360 V98" marker-end="url(#ah)"/>
<text class="note" x="432" y="124">segundo cenário</text>
</svg>
</body></html>
