# Ajustes do RabbitMQ para os experimentos.
# Documentar qualquer alteracao aqui na tabela de configuracao do artigo:
# a comparacao com o Kafka so e valida se as garantias forem equivalentes.
# Valores de fabrica e o motivo de cada desvio em docs/AUDITORIA-CONFIG.md.

# Memoria que o RabbitMQ considera disponivel: os 3 GB do mem_limit do
# container (BROKER_MEMORY no compose). Sem isto, ele calcula sobre a memoria
# da VM do WSL2 inteira: o limite ficava em 4.706 MiB num container de
# 3.072 MiB, e o kernel mataria o broker antes de o freio de memoria segurar
# os produtores (AUDITORIA-CONFIG, defeito 2). Mudou BROKER_MEMORY, muda aqui.
total_memory_available_override_value = 3221225472

# Freio de memoria em 60% do disponivel, cerca de 1,8 GB. E o valor de
# fabrica; fica explicito porque depende da linha acima.
vm_memory_high_watermark.relative = 0.6

# Metricas no formato Prometheus (porta 15692). O plugin ja vem embutido.
prometheus.return_per_object_metrics = true
