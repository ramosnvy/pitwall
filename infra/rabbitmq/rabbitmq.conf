# Ajustes do RabbitMQ para os experimentos.
# Documentar qualquer alteracao aqui na tabela de configuracao do artigo:
# a comparacao com o Kafka so e valida se as garantias forem equivalentes.

# Limite de memoria antes de aplicar backpressure nos publishers.
# 0.6 do mem_limit do container definido no compose.
vm_memory_high_watermark.relative = 0.6

# Espaco livre em disco antes de bloquear publicacoes.
disk_free_limit.absolute = 2GB

# Metricas no formato Prometheus (porta 15692). O plugin ja vem embutido.
prometheus.return_per_object_metrics = true
