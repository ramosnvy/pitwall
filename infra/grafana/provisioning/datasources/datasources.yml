apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Resultados consolidados: tabela matrix_run, carregada por
  # analysis/load-results.ps1 a partir dos CSVs de results/.
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: pitwall
    jsonData:
      database: pitwall
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $PITWALL_DB_PASSWORD
