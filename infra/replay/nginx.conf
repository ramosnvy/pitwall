# Serve o replay visual (tools/race-replay/web). Os JSONs de cada corrida
# passam de 12 MB; com gzip, trafegam cerca de um quarto disso.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css;

    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
