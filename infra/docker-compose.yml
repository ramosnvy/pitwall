# Infraestrutura dos experimentos do PitWall.
#
# Os brokers ficam em profiles separados: cada bateria de experimentos sobe
# apenas o broker avaliado, para que o outro nao consuma CPU nem memoria da
# maquina durante a medicao.
#
#   docker compose --profile kafka  up -d
#   docker compose --profile rabbit up -d
#   docker compose --profile metrics up -d
#
# Os limites de cpus/mem_limit sao fixos e iguais entre os brokers: sem isso a
# comparacao nao e justa, porque um broker poderia simplesmente usar mais
# recursos que o outro.

name: pitwall

services:
  postgres:
    image: postgres:17-alpine
    container_name: pitwall-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitwall}
      POSTGRES_DB: ${POSTGRES_DB:-pitwall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Ajustes para escrita em lote: menos pressao de checkpoint durante as
    # rajadas de COPY. Nao alteram a semantica, apenas o custo de I/O.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - synchronous_commit=off
    cpus: ${POSTGRES_CPUS:-2}
    mem_limit: ${POSTGRES_MEMORY:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitwall} -d ${POSTGRES_DB:-pitwall}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    container_name: pitwall-kafka
    profiles: ["kafka"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topico criado explicitamente pelo script de experimento; a criacao
      # automatica fica desligada para o numero de particoes ser sempre o
      # declarado no experimento.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-4}
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx2G -Xms2G}
    volumes:
      - kafka-data:/var/lib/kafka/data
    cpus: ${BROKER_CPUS:-4}
    mem_limit: ${BROKER_MEMORY:-4g}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pitwall-rabbitmq
    profiles: ["rabbit"]
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_UI_PORT:-15672}:15672"
      - "15692:15692"   # metricas Prometheus (plugin nativo do RabbitMQ 4)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-pitwall}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-pitwall}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-pitwall.conf:ro
    cpus: ${BROKER_CPUS:-4}
    mem_limit: ${BROKER_MEMORY:-4g}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: pitwall-prometheus
    profiles: ["metrics"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    cpus: ${METRICS_CPUS:-1}
    mem_limit: ${METRICS_MEMORY:-1g}
    restart: unless-stopped

  cadvisor:
    # Fonte de CPU e memoria por container, inclusive dos brokers.
    image: gcr.io/cadvisor/cadvisor:v0.53.0
    container_name: pitwall-cadvisor
    profiles: ["metrics"]
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    cpus: ${METRICS_CPUS:-1}
    mem_limit: ${METRICS_MEMORY:-1g}
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  rabbit-data:
  prometheus-data:
