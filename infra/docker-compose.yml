# Infraestrutura dos experimentos do PitWall.
#
# Os brokers ficam em profiles separados: cada bateria de experimentos sobe
# apenas o broker avaliado, para que o outro nao consuma CPU nem memoria da
# maquina durante a medicao.
#
#   docker compose --profile kafka  up -d
#   docker compose --profile rabbit up -d
#   docker compose --profile metrics up -d
#
# Os limites de cpus/mem_limit sao fixos e iguais entre os brokers: sem isso a
# comparacao nao e justa, porque um broker poderia simplesmente usar mais
# recursos que o outro.

name: pitwall

services:
  postgres:
    image: postgres:17-alpine
    container_name: pitwall-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitwall}
      POSTGRES_DB: ${POSTGRES_DB:-pitwall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Ajustes para escrita em lote: menos pressao de checkpoint durante as
    # rajadas de COPY. Nao alteram a semantica, apenas o custo de I/O.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - synchronous_commit=off
    cpus: ${POSTGRES_CPUS:-2}
    mem_limit: ${POSTGRES_MEMORY:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitwall} -d ${POSTGRES_DB:-pitwall}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    container_name: pitwall-kafka
    profiles: ["kafka"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topico criado explicitamente pelo script de experimento; a criacao
      # automatica fica desligada para o numero de particoes ser sempre o
      # declarado no experimento.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-4}
      # Retencao curta: a 100 mil ev/s o log cresce cerca de 7 MB/s, entao
      # duas horas de retencao guardariam dezenas de GB de rodadas ja
      # analisadas. As rodadas duram minutos e o topico e recriado entre elas.
      KAFKA_LOG_RETENTION_MINUTES: 15
      # Compressao desligada: o workload replica a mesma amostra em varios
      # carros, entao os lotes ficam cheios de bytes parecidos e a compressao
      # renderia muito mais do que renderia com telemetria real, inflando o
      # throughput do Kafka por artefato do workload e nao por arquitetura.
      # No broker o valor e "uncompressed"; "none" so vale do lado do produtor,
      # onde o cliente Confluent.Kafka tambem precisa declara-lo.
      KAFKA_COMPRESSION_TYPE: uncompressed
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1536m -Xms1536m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    cpus: ${BROKER_CPUS:-4}
    mem_limit: ${BROKER_MEMORY:-3g}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pitwall-rabbitmq
    profiles: ["rabbit"]
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_UI_PORT:-15672}:15672"
      - "15692:15692"   # metricas Prometheus (plugin nativo do RabbitMQ 4)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-pitwall}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-pitwall}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-pitwall.conf:ro
    cpus: ${BROKER_CPUS:-4}
    mem_limit: ${BROKER_MEMORY:-3g}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: pitwall-prometheus
    profiles: ["metrics"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    cpus: ${METRICS_CPUS:-0.5}
    mem_limit: ${METRICS_MEMORY:-512m}
    restart: unless-stopped

  cadvisor:
    # Fonte de CPU e memoria por container, inclusive dos brokers.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: pitwall-cadvisor
    profiles: ["metrics"]
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Sem o socket do containerd, o cAdvisor nao registra o backend do
      # Docker e enxerga apenas a maquina, sem separar por container.
      - /var/run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      # Os cgroups vivem em /sys; sem este mount o cAdvisor nao consegue ler
      # o uso de CPU e memoria de cada container.
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    cpus: ${METRICS_CPUS:-0.5}
    mem_limit: ${METRICS_MEMORY:-512m}
    restart: unless-stopped

  # --- Painel local (profile "dash") ---------------------------------------
  # Grafana sobre o Prometheus (metricas), o Loki (logs dos containers) e o
  # PostgreSQL (resultados consolidados das matrizes). Serve para depurar e
  # acompanhar rodadas; na matriz oficial fica desligado, porque disputa CPU
  # com o que esta sendo medido (docs/AMEACAS-VALIDADE.md).
  #
  #   docker compose --profile metrics --profile dash up -d
  #   http://localhost:3000

  grafana:
    image: grafana/grafana:12.1.1
    container_name: pitwall-grafana
    profiles: ["dash"]
    ports:
      # So no loopback: acesso anonimo com papel de administrador e aceitavel
      # na maquina local, nao na rede.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rodada-ao-vivo.json
      PITWALL_DB_PASSWORD: ${POSTGRES_PASSWORD:-pitwall}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    cpus: ${DASH_CPUS:-0.5}
    mem_limit: ${DASH_MEMORY:-512m}
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    container_name: pitwall-loki
    profiles: ["dash"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    cpus: ${DASH_CPUS:-0.5}
    mem_limit: ${DASH_MEMORY:-512m}
    restart: unless-stopped

  alloy:
    # Coleta os logs dos containers pitwall-* direto do Docker e os envia ao
    # Loki. Produtor e consumidor sao removidos a cada rodada; com o Loki, os
    # logs deles sobrevivem, rotulados pela rodada.
    image: grafana/alloy:v1.10.2
    container_name: pitwall-alloy
    profiles: ["dash"]
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    cpus: ${ALLOY_CPUS:-0.25}
    mem_limit: ${ALLOY_MEMORY:-256m}
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  rabbit-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
